<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YTJam TV</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#0f0f1e; overflow:hidden; }
    body { font-family: Arial, Helvetica, sans-serif; color:#fff; text-align:center; }
    .wrap { position:absolute; top:50%; left:0; width:100%; margin-top:-140px; }
    .brand { font-size:52px; font-weight:bold; letter-spacing:2px; }
    .brand em { color:#e74c3c; font-style:normal; }
    .hint { font-size:26px; color:#aaa; margin-top:36px; }
    .host { font-size:22px; color:#555; margin-top:64px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">YT<em>Jam</em> TV</div>
    <div class="hint" id="hint">Conectando...</div>
    <div class="host">ytjam.ozcho.com</div>
  </div>

  <script>
    /* ES5: navegadores de TV antiguos (Tizen 2.4+) */
    var SERVER = 'https://ytjam.ozcho.com';
    var hintEl = document.getElementById('hint');
    var attempt = 0;

    // La TV suele arrancar la app antes de tener red: reintentar hasta que responda
    function connect() {
      attempt++;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SERVER + '/api/config?t=' + new Date().getTime(), true);
      xhr.timeout = 8000;
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 400) {
          window.location.href = SERVER + '/tv';
        } else {
          retry('El servidor respondi\u00f3 ' + xhr.status);
        }
      };
      xhr.onerror = function () { retry('Sin conexi\u00f3n con el servidor'); };
      xhr.ontimeout = function () { retry('El servidor no responde'); };
      xhr.send();
    }

    function retry(msg) {
      hintEl.textContent = msg + ' \u00b7 reintentando (' + attempt + ')';
      setTimeout(connect, 5000);
    }

    connect();

    // RETURN/EXIT del mando cierra la app
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 10009 && window.tizen && tizen.application) {
        tizen.application.getCurrentApplication().exit();
      }
    });
  </script>
</body>
</html>
